name: "domain_navigation"

reward_weights:
  # Primary progress reward: +w_progress points per metre of forward advance along path
  w_progress: 40.0
  # Cross-track error (CTE) penalty — penalises lateral deviation from A* route
  w_cte: 1.0
  # Attitude cost — penalises non-horizontal pitch and roll
  w_pitch_roll: 20.0
  # Heading alignment with lookahead point
  w_align: 2.0
  # Lateral and vertical velocity costs
  w_sway_vel: 2.0
  w_heave_vel: 2.0
  # Action magnitude and smoothness
  w_accel: 0.15
  w_delta_accel: 0.5
  # Time penalty per step
  time_penalty: 0.2
  # Success bonus on reaching the goal
  success: 600.0
  w_final_bonus: 200.0
  # Obstacle collision penalty per step in the critical zone
  w_collision_step: 5.0

goals:
  success_dist: 2.0
  max_dist: 45.0
  start_pos: [-13.0, -3.0, 10.0]
  target_pos: [18.0, 0.0, 10.0]

safety:
  warning_distance: 3.5
  critical_distance: 0.5

curriculum:
  initial_stage: 0
  max_stage: 4
  target_success_rate: 0.85
  window_size: 60
