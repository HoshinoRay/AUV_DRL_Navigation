# configs/task/stage3_domain_navigation.yaml
name: "domain_navigation"
_target_: src.envs.tasks.domain_navigation.DomainNavigationTask

# 【全新参数体系】
reward_weights:
  w_progress: 40.0        # [主导] 前进 1 米给 40 分，主导推进的动力
  w_cte: 1.0             # [核心] 横向误差惩罚(CTE)，越偏离航线扣分越多，逼迫贴着A*走
  w_pitch_roll: 20.0      # [防起飞] 严厉惩罚非水平姿态，彻底解决当火箭飞上天的问题
  w_align: 2.0            # 机头对准 A* 路径前视点的适度加分
  w_sway_vel: 2.0         # 惩罚侧滑速度
  w_heave_vel: 2.0        # 惩罚异常的垂直升降速度
  w_accel: 0.15           # 抑制过大输出
  w_delta_accel: 0.5      # 动作平滑惩罚
  time_penalty: 0.2       # 时间惩罚，逼迫尽快完成
  success: 600.0          # 进圈成功奖励
  w_final_bonus: 200.0    # 终点奖励
  w_collision_step: 5.0   # 靠近障碍物时的步进扣分机制

goals:
  success_dist: 2.0
  max_dist: 45.0
  start_pos: [-13.0, -3.0, 10.0]   
  target_pos: [18.0, 0.0, 10.0]

safety:
  warning_distance: 3.5   # A* 安全膨胀半径是 1.5，警告区设在 3.5 左右即可
  critical_distance: 0.5

curriculum:
  initial_stage: 0         # 默认从 0 阶段开始
  max_stage: 4            # 最高阶段
  target_success_rate: 0.85 # 升级阈值
  window_size: 60         # 评估窗口