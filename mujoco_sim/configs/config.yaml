# configs/config.yaml

defaults:
  - env: default
  - task: stage1_navigate
  - _self_

project_name: "AUV_Control_Yuyuan"
seed: 42
device: "cuda"

total_timesteps: 5000000

num_envs: 1
eval_freq: 10000
save_freq: 50000

hyperparams:
  learning_rate: 3.0e-4
  buffer_size: 1000000
  # Larger batch improves gradient stability for off-policy RL
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  ent_coef: "auto"
  # Only relevant for a fresh model; overridden to 0 when loading a checkpoint
  learning_starts: 5000
  train_freq: 1
  # Keep UTD ratio at 1:1 regardless of num_envs
  gradient_steps: ${num_envs}

pretrained:
  model_path: null
  vecnorm_path: null

  load_buffer: False
  buffer_path: null

  reset_timesteps: True
  save_buffer_at_end: True

weights_dir: "src/weights"
